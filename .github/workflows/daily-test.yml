
name: Publish daily OUSSC test

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's paper
        run: python generate_daily.py

      - name: Check generated paper
        run: |
          python -c "import json; d=json.load(open('daily-test.json', encoding='utf-8')); assert len(d['questions']) == 100; print('100 questions generated successfully')"

      - name: Publish daily paper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-test.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily OUSSC test"
            git push
          else
            echo "No changes to publish"
          fi
