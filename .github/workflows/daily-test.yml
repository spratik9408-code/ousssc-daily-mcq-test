
name: Publish daily OUSSC test

on:
  schedule:
    # 07:00 AM Indian Standard Time
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate today's paper
        run: python generate_daily.py

      - name: Publish daily paper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-test.json
          git diff --cached --quiet || git commit -m "Publish daily OUSSC test"
          git push
